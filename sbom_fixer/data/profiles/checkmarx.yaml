# What Checkmarx One SCA can import.
# accepted_versions and floor are PROVISIONAL (ADR-01): replace them with the result of the
# upload matrix in docs/checkmarx-matrix.md (SBOMFIX-102) before relying on them.
name: checkmarx
description: Checkmarx One SCA import copy
cyclonedx:
  floor: "1.3"
  accepted_versions: ["1.3", "1.4", "1.5"]
spdx:
  floor: "2.2"
  accepted_versions: ["2.2", "2.3"]
acceptance: profile          # profile | checkmarx (real upload per level) | schema-only
tools_form: as-is            # as-is | legacy-array (use legacy-array if Checkmarx only reads the 1.4 array form)
flatten_nested_components: true
require_purl: warn           # warn | fail
allow_data_loss: true        # false -> exit 3 when any DATA_LOSS change happens
max_size_mb: 50
provenance: true
quality:
  audit: report              # never gate the scanner copy on quality (ADR-15)
  fail_on_regression: true
  min_score: 0
  score_tolerance: 0.2

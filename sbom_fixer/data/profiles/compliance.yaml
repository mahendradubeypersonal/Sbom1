# Copy kept for customers, auditors and regulators. It is repaired and sanitized but never downgraded.
name: compliance
description: Compliance copy, never downgraded
cyclonedx:
  floor: declared
  accepted_versions: ["1.3", "1.4", "1.5", "1.6", "1.7"]
spdx:
  floor: declared
  accepted_versions: ["2.2", "2.3"]
acceptance: schema-only
tools_form: as-is
flatten_nested_components: false
require_purl: warn
allow_data_loss: true
max_size_mb: 200
provenance: true
quality:
  audit: report              # ADR-15: report-only in v1.0; switch to gate after one release cycle
  fail_on_regression: true
  min_score: 0
  score_tolerance: 0.2
frameworks:
  - id: ntia-2021
    gate: advisory           # becomes "required" after the report-only period
    version_note: "NTIA Minimum Elements for an SBOM, July 2021"
  - id: cisa-fsct-2024
    gate: advisory
    version_note: "CISA Framing Software Component Transparency, 3rd edition, 2024"
  - id: bsi-tr-03183-2-v2
    gate: advisory
    min_spec_version: "1.5"
    version_note: "BSI TR-03183-2 v2.x; make required for EU / German customers"
